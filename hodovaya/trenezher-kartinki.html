#feedback.bad{color:#ef6b6b;}

#result h2{color:#ffa733;text-align:center;}
#score{text-align:center;font-size:20px;font-weight:bold;color:#e8eaed;}
.again{display:block;width:100%;padding:14px;font-size:17px;font-weight:bold;color:#12151c;background:#4caf50;border:none;border-radius:8px;cursor:pointer;}
.again:hover{background:#43a047;}
.back{display:block;text-align:center;margin-top:20px;color:#ffa733;}

var order=[],idx=0,score=0,answered=false;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function start(){
  order=shuffle(QUESTIONS.map(function(_,i){return i;}));
  idx=0;score=0;
  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="block";
  show();
}

function show(){
  var q=QUESTIONS[order[idx]];
  answered=false;
  document.getElementById("counter").textContent="Вопрос "+(idx+1)+" из "+QUESTIONS.length;
  document.getElementById("qtext").textContent=q.q;
  var im=document.getElementById("qimg");
  im.src=q.img; im.style.display="block";
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("nextBtn").style.display="none";
  var perm=shuffle([0,1,2,3]);
  var box=document.getElementById("opts");
  box.innerHTML="";
  for(var k=0;k<4;k++){
    var b=document.createElement("button");
    b.className="opt";
    b.textContent=q.a[perm[k]];
    if(perm[k]===0){b.setAttribute("data-c","1");}else{b.setAttribute("data-c","0");}
    b.onclick=function(){answer(this);};
    box.appendChild(b);
  }
}

function answer(btn){
  if(answered)return;
  answered=true;
  var buttons=document.getElementById("opts").getElementsByTagName("button");
  for(var i=0;i<buttons.length;i++){
    buttons[i].disabled=true;
    if(buttons[i].getAttribute("data-c")==="1"){buttons[i].classList.add("correct");}
  }
  var fb=document.getElementById("feedback");
  if(btn.getAttribute("data-c")==="1"){
    score++;
    fb.textContent="Верно!";
    fb.className="ok";
  }else{
    btn.classList.add("wrong");
    fb.textContent="Неправильно. Правильный ответ выделен зелёным.";
    fb.className="bad";
  }
  document.getElementById("nextBtn").style.display="block";
}

function nextQ(){
  idx++;
  if(idx>=QUESTIONS.length){
    document.getElementById("quiz").style.display="none";
    document.getElementById("result").style.display="block";
    document.getElementById("score").textContent="Правильных ответов: "+score+" из "+QUESTIONS.length;
  }else{
    show();
  }
}

start();
</script>
