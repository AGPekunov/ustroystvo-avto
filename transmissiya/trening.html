<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    text-decoration: none;

  }
  .tren:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(255,167,51,0.45);
    border: 1px solid #ffa733;
  }
  .icon {
    width: 44px;
    height: 44px;
    padding: 10px;
    background: rgba(255,167,51,0.15);
    border-radius: 10px;
    flex-shrink: 0;
  }
  .icon svg {
    width: 100%;
    height: 100%;
    stroke: #ffa733;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tren h2 { font-size: 17px; }
  .tren h2 span { color: #ffa733; margin-right: 8px; }
  .back {
    display: block;
    text-align: center;
