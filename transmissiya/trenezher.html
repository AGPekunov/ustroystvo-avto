<head>
<meta charset="UTF-8">

<title>Тренажёр: Коробка передач автомобилей</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1e2633; color: #eef2f7; min-height: 100vh; }
  header { background: #14202e; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  header h1 { font-size: 20px; font-weight: 600; }
  .modes { display: flex; gap: 8px; }
  .mode-btn { padding: 8px 16px; border: 1px solid #3b4a5e; background: #22303f; color: #cfd8e3; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .mode-btn.active { background: #2f81f7; color: #fff; border-color: #2f81f7; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  .score { font-size: 15px; color: #9fb3c8; }
  .score b { color: #ffd166; }
  .card { background: #243244; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .q-count { color: #8fa3ba; font-size: 13px; margin-bottom: 12px; letter-spacing: .5px; }
  .pic { background: #f4f7fb; border-radius: 12px; padding: 12px; display: flex; justify-content: center; margin-bottom: 18px; }
  .pic img.photo { max-width: 100%; max-height: 280px; border-radius: 8px; cursor: zoom-in; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { padding: 14px 16px; border: 2px solid #3b4a5e; background: #2b3b4f; color: #eef2f7; border-radius: 10px; cursor: pointer; font-size: 16px; text-align: left; transition: .15s; }
  .opt:hover { border-color: #2f81f7; background: #31465f; }
  .opt.correct { border-color: #3fb950; background: #1d3a26; }
  .opt.wrong { border-color: #f85149; background: #3a1d1d; }
  .opt:disabled { cursor: default; opacity: .85; }
  .feedback { min-height: 28px; margin-top: 16px; font-size: 15px; }
  .feedback.ok { color: #3fb950; }
  .feedback.err { color: #f85149; }
  .next-btn, .restart-btn { margin-top: 14px; padding: 12px 28px; background: #2f81f7; border: none; color: #fff; border-radius: 10px; font-size: 16px; cursor: pointer; display: none; }
  .next-btn:hover, .restart-btn:hover { background: #1f6fe0; }
  .pairs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 10px; }
  .pairs-col { display: flex; flex-direction: column; gap: 10px; }
  .pairs-col h3 { font-size: 13px; color: #8fa3ba; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .pair-item { padding: 12px; border: 2px solid #3b4a5e; background: #2b3b4f; border-radius: 10px; cursor: pointer; text-align: center; font-size: 15px; transition: .15s; }
  .pair-item.sel { border-color: #ffd166; }
  .pair-item.done { border-color: #3fb950; background: #1d3a26; opacity: .55; cursor: default; }
  .mini { position: relative; background: #f4f7fb; border-radius: 8px; padding: 4px; margin-bottom: 6px; }
  .mini img.photo { max-width: 100%; max-height: 110px; border-radius: 6px; display: block; margin: 0 auto; }
  .zoom-btn { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: none; border-radius: 6px; background: rgba(20,32,46,.75); color: #fff; cursor: pointer; font-size: 13px; }
  .zoom-btn:hover { background: rgba(47,129,247,.9); }
  .result { text-align: center; padding: 30px; }
  .result h2 { margin-bottom: 12px; }
  .result .big { font-size: 52px; color: #ffd166; margin: 14px 0; }
  .result .verdict { font-size: 17px; color: #9fb3c8; margin-bottom: 20px; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(10,15,22,.93); z-index: 50; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox img { max-width: 94vw; max-height: 94vh; border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
</style>
</head>

// ---------- Состояние ----------
let score = 0, qIndex = 0, order = [], mode = 'quiz', pairsSel = null, pairsDone = 0;
const $ = id => document.getElementById(id);

function shuffle(a){ return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]); }

function setScore(){ $('score').textContent = score; }

// ---------- Режим «Найди название» ----------
function startQuiz(){
  mode='quiz'; score=0; qIndex=0;
  order = shuffle(TERMS.map((_,i)=>i));
  setScore(); renderQ();
}

function renderQ(){
  const app = $('app');
  if (qIndex >= order.length){ return showResult(order.length, Math.round(score/order.length*100)); }
  const term = TERMS[order[qIndex]];
  const distractors = shuffle(TERMS.filter(t=>t.key!==term.key)).slice(0,3).map(t=>t.name);
  const opts = shuffle([term.name, ...distractors]);

  app.innerHTML = `
    <div class="card">
      <div class="q-count">Вопрос ${qIndex+1} из ${order.length} · Что изображено на картинке?</div>
      <div class="pic">${ICONS[term.key]}</div>
      <div class="options">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <button class="next-btn" id="nextBtn">Следующий вопрос →</button>
    </div>`;
  $('nextBtn').onclick = ()=>{ qIndex++; renderQ(); };

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
      const ok = btn.dataset.o === term.name;
      if (ok){ btn.classList.add('correct'); score++; $('fb').textContent='Верно! '+term.hint; $('fb').className='feedback ok'; }
      else {
        btn.classList.add('wrong');
        document.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.o===term.name) b.classList.add('correct'); });
        $('fb').textContent='Неверно. Правильно: '+term.name+'. '+term.hint; $('fb').className='feedback err';
      }
      setScore();
      $('nextBtn').style.display='inline-block';
      $('nextBtn').textContent = qIndex+1>=order.length ? 'Показать результат →' : 'Следующий вопрос →';
    };
  });
}

// ---------- Режим «Собери пары» ----------
function startPairs(){
  mode='pairs'; score=0; pairsDone=0; pairsSel=null; setScore();
  const pics = shuffle(TERMS.slice()).slice(0,8);
  const names = shuffle(pics.map(t=>t.name));
  const app = $('app');
  app.innerHTML = `
    <div class="card">
      <div class="q-count">Выберите картинку, затем её название (или наоборот). Соберите все пары.</div>
      <div class="pairs-grid">
        <div class="pairs-col"><h3>Картинки</h3>${pics.map(t=>`<div class="pair-item" data-key="${t.key}" data-side="pic"><div class="mini">${ICONS[t.key]}<button class="zoom-btn" title="Увеличить">🔍</button></div></div>`).join('')}</div>
        <div class="pairs-col"><h3>Названия</h3>${names.map(n=>`<div class="pair-item" data-name="${n}" data-side="name">${n}</div>`).join('')}</div>
      </div>
      <div class="feedback" id="fb"></div>
      <button class="restart-btn" id="rst" style="display:none">Играть заново</button>
    </div>`;
  $('rst').onclick = startPairs;

  document.querySelectorAll('.pair-item').forEach(el=>{
    el.onclick = (ev)=>{
      if (ev.target.closest('.zoom-btn')) return;
      if (el.classList.contains('done')) return;
      if (pairsSel === null){ pairsSel = el; el.classList.add('sel'); return; }
      if (pairsSel === el){ el.classList.remove('sel'); pairsSel = null; return; }
      const a = pairsSel, b = el;
      const match = (a.dataset.side==='pic' && b.dataset.side==='name' && TERMS.find(t=>t.key===a.dataset.key).name===b.dataset.name)
                 || (a.dataset.side==='name' && b.dataset.side==='pic' && TERMS.find(t=>t.key===b.dataset.key).name===a.dataset.name);
      if (match){
        a.classList.remove('sel'); a.classList.add('done'); b.classList.add('done');
        score++; pairsDone++; setScore();
        $('fb').textContent = 'Пара собрана! ('+pairsDone+' из 8)'; $('fb').className='feedback ok';
        pairsSel = null;
        if (pairsDone === 8){
          $('fb').textContent = 'Все пары собраны! Молодец!';
          showResult(8, 100);
        }
      } else {
        a.classList.remove('sel'); b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),500);
        score = Math.max(0, score-1); setScore();
        $('fb').textContent = 'Не та пара. Попробуйте ещё.'; $('fb').className='feedback err';
        pairsSel = null;
      }
    };
  });
}

// ---------- Результат ----------
function showResult(total, percent){
  let verdict;
  if (percent >= 90) verdict = 'Отлично! Материал усвоен — можно допускать к работе на станции.';
  else if (percent >= 70) verdict = 'Хорошо! Но стоит повторить материал.';
  else if (percent >= 50) verdict = 'Удовлетворительно. Рекомендуется повторная проработка.';
  else verdict = 'Нужно ещё поработать с материалом. Разберите ошибки с преподавателем.';
  $('app').innerHTML = `
    <div class="card result">
      <h2>${percent>=70 ? '🎉 Результат' : '📋 Результат'}</h2>
      <div class="big">${percent}%</div>
      <div class="verdict">${verdict}</div>
      <button class="restart-btn" style="display:inline-block" id="rst2">Пройти ещё раз</button>
    </div>`;
  $('rst2').onclick = ()=> mode==='quiz' ? startQuiz() : startPairs();
}

// ---------- Переключение режимов ----------
$('mQuiz').onclick = ()=>{ $('mQuiz').classList.add('active'); $('mPairs').classList.remove('active'); startQuiz(); };
$('mPairs').onclick = ()=>{ $('mPairs').classList.add('active'); $('mQuiz').classList.remove('active'); startPairs(); };

// ---------- Лупа (увеличение картинки) ----------
const lb = document.createElement('div');
lb.id = 'lightbox';
document.body.appendChild(lb);
lb.onclick = () => lb.style.display = 'none';
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.style.display = 'none'; });

function openZoom(srcStr){ lb.innerHTML = '<img src="' + srcStr + '" alt="">'; lb.style.display = 'flex'; }

document.addEventListener('click', e => {
  const im = e.target.closest('.pic img.photo');
  if (im){ openZoom(im.src); return; }
  const zb = e.target.closest('.zoom-btn');
  if (zb){ const it = zb.closest('.mini').querySelector('img.photo'); if (it) openZoom(it.src); }
});

startQuiz();
</script>
