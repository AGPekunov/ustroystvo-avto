<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: ведущий мост</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background: #1e1e2f;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 560px; }
  .panel {
    background: #ffffff; border-radius: 14px;
    padding: 28px 26px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  h1 { color: #ffa733; font-size: 22px; margin-bottom: 6px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  label { display: block; font-size: 14px; color: #333; margin: 12px 0 4px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; font-size: 15px;
    border: 1px solid #c8c8c8; border-radius: 8px;
  }
  button {
    margin-top: 18px; width: 100%; padding: 12px;
    font-size: 16px; font-weight: 600; color: #fff;
    background: #ffa733; border: none; border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #e08f1f; }
  button.grey { background: #5a6b85; }
  .qnum { color: #b06a00; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .qtext { font-size: 17px; color: #222; margin-bottom: 16px; line-height: 1.45; }
  .opt {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 10px;
    font-size: 15px; line-height: 1.4; color: #222;
    background: #f2f4f8; border: 2px solid transparent;
    border-radius: 8px; cursor: pointer;
  }
  .opt:hover { border-color: #ffa733; }
  .opt.correct { background: #e2f4e2; border-color: #2e8b57; color: #1d5c37; font-weight: 600; }
  .opt.wrong { background: #fbe3e3; border-color: #c0392b; color: #7a2417; }
  .opt:disabled { cursor: default; }
  .expl {
    margin-top: 8px; padding: 12px 14px;
    background: #fff3e2; border-left: 4px solid #ffa733;
    border-radius: 0 8px 8px 0;
    font-size: 14px; color: #333; line-height: 1.5;
  }
  .score { font-size: 26px; font-weight: 700; color: #b06a00; text-align: center; margin: 10px 0 6px; }
  .verdict { text-align: center; font-size: 15px; color: #555; margin-bottom: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">

  <div id="startPanel" class="panel">
    <h1>Тренажёр: ведущий мост</h1>
    <p class="sub">15 вопросов по главной передаче, дифференциалу и полуосям. Варианты ответов перемешиваются при каждом запуске. В конце — оценка и выгрузка ведомости.</p>
    <label for="fio">Фамилия и имя</label>
    <input type="text" id="fio" placeholder="Иванов Иван">
    <label for="group">Группа</label>
    <input type="text" id="group" placeholder="АТ-21">
    <button onclick="startQuiz()">Начать</button>
  </div>

  <div id="quizPanel" class="panel hidden">
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div id="answers"></div>
    <div class="expl hidden" id="expl"></div>
    <button id="nextBtn" class="hidden" onclick="nextQuestion()">Дальше</button>
  </div>

  <div id="resultPanel" class="panel hidden">
    <h1 style="text-align:center;">Результат</h1>
    <div class="score" id="scoreLine"></div>
    <div class="verdict" id="verdictLine"></div>
    <button onclick="downloadResult()">Скачать ведомость</button>
    <button class="grey" onclick="location.reload()">Пройти ещё раз</button>
  </div>

</div>

<script>
var QUESTIONS = [
  {
    "q": "Для чего предназначен ведущий мост?",
    "a": [
      "Для передачи крутящего момента от карданного вала на ведущие колёса",
      "Для крепления кузова к раме и смягчения толчков",
      "Для изменения направления движения автомобиля",
      "Для запуска двигателя от колёс"
    ],
    "e": "Ведущий мост принимает крутящий момент от карданной передачи и через главную передачу, дифференциал и полуоси передаёт его на ведущие колёса."
  },
  {
    "q": "Для чего служит главная передача?",
    "a": [
      "Увеличивает крутящий момент и передаёт его к полуосям под прямым углом",
      "Выравнивает скорость вращения колёс, распределяет момент вращения при повороте",
      "Уменьшает крутящий момент и распределеят его между колесами через полуоси",
      "Служит для движения задним ходом"
    ],
    "e": "Главная передача состоит из пары шестерён: она дополнительно увеличивает крутящий момент после КПП и меняет направление вращения на 90 градусов."
  },
  {
    "q": "Из каких шестерён состоит главная передача?",
    "a": [
      "Ведущая малая коническая и ведомая большая коническая",
      "Две одинаковые цилиндрические",
      "Ведущая большая и ведомая малая цилиндрические",
      "Три шестерни одинакового размера"
    ],
    "e": "Ведущая шестерня малая, соединена с карданным валом; ведомая — большая, закреплена в картере. Малая вращает большую — момент увеличивается."
  },
  {
    "q": "Чем отличается главная передача с гипоидным зацеплением от обычной конической?",
    "a": [
      "Ведущая шестерня смещена относительно оси ведомой",
      "Она не требует смазки",
      "В ней нет ведомой шестерни",
      "Она увеличивает частоту вращения вместо крутящего момента"
    ],
    "e": "Смещение (гипоидное смещение) даёт непрерывное зацепление нескольких зубьев: передача работает тише, зубья менее нагружены."
  },
  {
    "q": "Для чего в ведущем мосту установлен дифференциал?",
    "a": [
      "Чтобы колёса могли вращаться с разными угловыми скоростями",
      "Чтобы блокировать колёса при торможении",
      "Чтобы менять крутящий момент в 2 раза",
      "Чтобы защищать мост от перегрузки"
    ],
    "e": "В повороте внешнее колесо проходит больший путь, чем внутреннее. Дифференциал позволяет полуосям вращаться с разными скоростями, не пробуксовывая шинами."
  },
  {
    "q": "Что происходит с сателлитами при прямолинейном движении по ровной дороге?",
    "a": [
      "Не вращаются вокруг собственных осей — вся система вращается как единое целое",
      "Вращаются с удвоенной скоростью",
      "Вращаются вокруг собственных осей - каждый сателлит работает отдельно",
      "Вращаются в противоположную сторону"
    ],
    "e": "При одинаковом сопротивлении под обоими колёсами сателлиты не проворачиваются на своей оси, а лишь вращаются вместе с коробкой дифференциала."
  },
  {
    "q": "Что произойдёт с колёсами, если одно из них забуксовало?",
    "a": [
      "Буксующее вращается с удвоенной скоростью, а второе останавливается",
      "Оба колеса останавливаются",
      "Оба вращаются с одинаковой скоростью",
      "Буксующее останавливается, второе вращается быстрее"
    ],
    "e": "Весь крутящий момент уходит в наименее нагруженное колесо: оно вращается вдвое быстрее, а второе теряет тягу. Отсюда необходимость блокировки дифференциала."
  },
  {
    "q": "Какие детали входят в дифференциал?",
    "a": [
      "Коробка дифференциала, полуосевые шестерни, сателлиты и крестовина",
      "Ведущая и ведомая шестерни главной передачи, коробка дифференциала, полуосевые шестерни, сателлиты и крестовина",
      "Шлицевой вал и подвесной подшипник, главная передача, сателлиты, крестовина",
      "Задний мост, главная передача, шестерни, полуоси"
    ],
    "e": "Коробка дифференциала вращается с ведомой шестернёй, в ней на крестовине сидят сателлиты, находящиеся в зацеплении с полуосевыми шестернями."
  },
  {
    "q": "Для чего служит полуось?",
    "a": [
      "Передаёт крутящий момент от полуосевой шестерни дифференциала к ведущему колесу",
      "Соединяет дифференциал с ведущим колесом",
      "Принимает крутящий момент от карданной передачи и передаёт момент к ступице колеса",
      "Служит направляющей для установки ведущего колеса"
    ],
    "e": "Полуось — последний элемент трансмиссии: крутящий момент дифференциала она передаёт напрямую на ступицу ведущего колеса."
  },
  {
    "q": "Чем полностью разгруженная полуось отличается от полуразгруженной?",
    "a": [
      "Не воспринимает изгибающие нагрузки, передаёт только крутящий момент",
      "Имеет больший диаметр и не вращается",
      "Воспринимает крутящий момент через подшипники",
      "Не имеет шлицевого соединения с шестернёй"
    ],
    "e": "У полуразгруженной полуоси наружный конец нагружается весом машины и боковыми силами, у полностью разгруженной — все нагрузки берут на себя подшипники ступицы."
  },
  {
    "q": "Какие подшипники поддерживают ведущую шестерню главной передачи?",
    "a": [
      "Конические роликоподшипники",
      "Только шариковые радиальные",
      "Игольчатые подшипники крестовины",
      "Подшипники скольжения без роликов"
    ],
    "e": "Конические шестерни создают осевые усилия, поэтому ведущую шестерню устанавливают на двух конических роликоподшипниках с регулировкой натяга."
  },
  {
    "q": "Какое масло применяют в главной передаче с гипоидным зацеплением?",
    "a": [
      "Трансмиссионное масло",
      "Моторное масло той же марки, что в двигателе",
      "Гидравлическая жидкость типа ATF",
      "Консистентную смазку Литол"
    ],
    "e": "В зацеплении гипоидной пары большие скольжения, обычное масло выдавливается с поверхности зубьев — нужны специальные противозадирные присадки."
  },
  {
    "q": "Какой признак указывает на износ или неправильную регулировку главной пары?",
    "a": [
      "Гул или вой",
      "Скрежет",
      "Вибрация",
      "Дисбаланс колеса"
    ],
    "e": "Гул главной пары — типичный диагноз: увеличенный зазор в зацеплении или износ зубьев усиливает шум пропорционально нагрузке."
  },
  {
    "q": "Как проверяют уровень масла в картере ведущего моста?",
    "a": [
      "Через контрольную пробку",
      "Через масляный щуп",
      "По датчику на панели приборов",
      "На глаз через снятое колесо"
    ],
    "e": "В картере моста щупа нет: уровень проверяют контрольной пробкой сбоку картера — масло должно быть на уровне нижней кромки отверстия."
  },
  {
    "q": "Для чего нужна блокировка дифференциала?",
    "a": [
      "Принудительно жёстко соединяет полуоси, чтобы оба колеса вращались одинаково",
      "Увеличивает передаточное число главной передачи",
      "Отключает задний мост при движении по трассе",
      "Служит для включения пониженной передачи"
    ],
    "e": "Блокировка устраняет главный недостаток дифференциала: при пробуксовке одного колеса момент снова распределяется на оба, машина не застревает."
  }
];

var order = [], score = 0, current = 0, fio = "", group = "";

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startQuiz() {
  fio = document.getElementById("fio").value.trim();
  group = document.getElementById("group").value.trim();
  if (!fio) { alert("Введите фамилию и имя"); return; }
  if (!group) { alert("Введите группу"); return; }
  order = shuffleArray(QUESTIONS);
  score = 0; current = 0;
  document.getElementById("startPanel").classList.add("hidden");
  document.getElementById("quizPanel").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  var q = order[current];
  document.getElementById("qnum").textContent = "Вопрос " + (current + 1) + " из " + order.length;
  document.getElementById("qtext").textContent = q.q;
  document.getElementById("expl").classList.add("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  var box = document.getElementById("answers");
  box.innerHTML = "";
  var idx = shuffleArray([0,1,2,3]);
  for (var k = 0; k < 4; k++) {
    (function(i){
      var btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = q.a[i];
      btn.onclick = function(){ answer(i, btn); };
      box.appendChild(btn);
    })(idx[k]);
  }
}

function answer(i, btn) {
  var q = order[current];
  var buttons = document.getElementById("answers").getElementsByTagName("button");
  for (var j = 0; j < buttons.length; j++) buttons[j].disabled = true;
  if (i === 0) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    for (var j = 0; j < buttons.length; j++) {
      if (buttons[j].textContent === q.a[0]) buttons[j].classList.add("correct");
    }
  }
  var ex = document.getElementById("expl");
  ex.textContent = q.e;
  ex.classList.remove("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion() {
  current++;
  if (current < order.length) showQuestion();
  else showResult();
}

function showResult() {
  document.getElementById("quizPanel").classList.add("hidden");
  document.getElementById("resultPanel").classList.remove("hidden");
  var total = order.length;
  var percent = Math.round(score / total * 100);
  var mark;
  if (percent >= 90) mark = 5;
  else if (percent >= 75) mark = 4;
  else if (percent >= 60) mark = 3;
  else mark = 2;
  var verdict = "";
  if (mark === 5) verdict = "Отлично! Материал по ведущему мосту усвоен.";
  else if (mark === 4) verdict = "Хорошо! Повторите вопросы, где были ошибки.";
  else if (mark === 3) verdict = "Удовлетворительно. Рекомендую пройти тренажёр ещё раз.";
  else verdict = "Пока слабо. Изучите материал по главной передаче и дифференциалу и пройдите тренажёр повторно.";
  document.getElementById("scoreLine").textContent = score + " из " + total + " · оценка " + mark;
  document.getElementById("verdictLine").textContent = verdict;
  window._result = { fio: fio, group: group, score: score, total: total, mark: mark };
}

function downloadResult() {
  var r = window._result;
  var d = new Date();
  var pad = function(n){ return n < 10 ? "0" + n : n; };
  var stamp = pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  var lines = [
    "ВЕДОМОСТЬ РЕЗУЛЬТАТОВ ТРЕНАЖЁРА",
    "Тема: Ведущий мост (главная передача, дифференциал, полуоси)",
    "Дата и время: " + stamp,
    "",
    "Фамилия и имя: " + r.fio,
    "Группа: " + r.group,
    "Правильных ответов: " + r.score + " из " + r.total,
    "Оценка: " + r.mark
  ];
  var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vedomost_most_" + r.group.replace(/\s+/g, "_") + "_" + r.fio.replace(/\s+/g, "_") + ".txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
